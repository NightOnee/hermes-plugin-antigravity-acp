name: antigravity-acp
label: Antigravity ACP (Interactive)
kind: standalone
version: 0.2.0
author: NightOnee
homepage: https://github.com/NightOnee/hermes-plugin-antigravity-acp
description: >
  Thin interactive ACP client for Google Antigravity. A native Desktop page
  chats with the official `agy acp` agent on your own Google sign-in: you type
  prompts directly, Antigravity owns its agent loop, history, tools and quota.
  This plugin deliberately registers no model provider, no tools, no hooks and
  no automation surface - Hermes never generates prompts for it.
requires_hermes: ">=0.21"
tags: [desktop, dashboard, acp, google, antigravity]
provides_tools: []
provides_hooks: []
optional_env:
  - name: ANTIGRAVITY_ACP_COMMAND
    description: "Override the agy/antigravity executable on the server (default: `agy` or `antigravity` on PATH)"
    prompt: "Antigravity CLI command"
    password: false
  - name: ANTIGRAVITY_ACP_HOME
    description: "Override the plugin's isolated profile directory on the server (default: ~/.hermes/plugins-data/antigravity-acp)"
    prompt: "Antigravity profile directory"
    password: false
